version: 2

models:
  - name: products
    config:
      contract:
        enforced: true
    description: >
      Data about all products in demo.
    columns:
      - name: product_id
        data_tests:
          - not_null
        data_type: text
        constraints:
          - type: not_null
        description: >
          UUID for each unique product on platform.
      - name: product_name
        data_type: TEXT                      
        constraints:
          - type: not_null
        description: >
          Name of the product.
      - name: unit_price_usd
        data_type: real
        constraints:
          - type: not_null
        description: >
          Price of the product.
      - name: inventory
        data_type: NUMBER                      
        constraints:
          - type: not_null
        description: >
          Amount of the inventory we have for this product.
      - name: date_load
        data_type: TIMESTAMP_TZ
        constraints:
          - type: not_null   
        description: >
          Date that the data was loaded.

  - name: promos
    config:
      contract:
        enforced: true
    description: >
      Data about all promotions (in)active.
    columns:
      - name: promo_id
        data_tests:
          - not_null
        data_type: TEXT
        constraints:
          - type: not_null
        description: >
          UUID (hashed names) for each unique promo on platform.
      - name: promo_name
        data_type: TEXT                      
        constraints:
          - type: not_null
        description: >
          Name of the promo.
      - name: discount_usd
        data_type: real
        constraints:
          - type: not_null
        description: >
          Discount amount in dollars.
      - name: status
        data_type: BOOLEAN                     
        constraints:
          - type: not_null
        description: >
          Whether a promo is active or not.
      - name: date_load_utc
        data_type: TIMESTAMP_TZ
        constraints:
          - type: not_null   
        description: >
          Date that the data was loaded (referred to UTC).